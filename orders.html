<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | SOLEVault</title>

    
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
}

nav{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    border-bottom:1px solid #222;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    font-weight:400;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:13px;
    text-transform:uppercase;
}

nav a:hover{
    color:#999;
}

.header{
    text-align:center;
    padding:65px 7% 45px;
}

.header p{
    color:#777;
    font-size:12px;
    letter-spacing:4px;
    margin-bottom:15px;
}

.header h1{
    font-size:55px;
    letter-spacing:-3px;
}

.orders-container{
    width:86%;
    max-width:1100px;
    margin:auto;
    padding-bottom:80px;
}

.order-card{
    background:#111;
    border:1px solid #222;
    padding:25px;
    margin-bottom:25px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding-bottom:18px;
    border-bottom:1px solid #222;
}

.order-id{
    font-size:13px;
    color:#aaa;
}

.order-status{
    color:#55c878;
    font-size:13px;
    font-weight:bold;
}

.order-content{
    display:grid;
    grid-template-columns:120px 1fr auto;
    gap:25px;
    align-items:center;
    padding-top:25px;
}

.order-image{
    width:120px;
    height:120px;
    object-fit:cover;
    background:#eee;
}

.product-name{
    font-size:20px;
    margin-bottom:10px;
}

.product-info{
    color:#777;
    font-size:13px;
    line-height:1.8;
}

.order-price{
    text-align:right;
}

.order-price small{
    display:block;
    color:#777;
    font-size:11px;
    margin-bottom:8px;
}

.order-price strong{
    font-size:20px;
}

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #222;
}

.detail-box{
    background:#050505;
    border:1px solid #222;
    padding:15px;
}

.detail-box small{
    display:block;
    color:#666;
    font-size:10px;
    letter-spacing:1px;
    margin-bottom:7px;
}

.detail-box span{
    font-size:13px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    background:#111;
    border:1px solid #222;
}

.empty h2{
    margin-bottom:12px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    padding:14px 25px;
    background:white;
    color:black;
    text-decoration:none;
    font-weight:bold;
}

.shop-btn:hover{
    background:#ccc;
}

@media(max-width:700px){

    nav ul{
        display:none;
    }

    .header h1{
        font-size:42px;
    }

    .order-content{
        grid-template-columns:90px 1fr;
        gap:15px;
    }

    .order-image{
        width:90px;
        height:90px;
    }

    .order-price{
        grid-column:2;
        text-align:left;
    }

    .details{
        grid-template-columns:1fr;
    }

    .order-top{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<nav>

    <div class="logo">
        SOLE<span>Vault</span>
    </div>

    <div>
        <a href="index.html">Home</a>
        &nbsp;&nbsp;
        <a href="shop.html">Shop</a>
    </div>

</nav>


<section class="header">

    <p>YOUR SOLEVAULT ACCOUNT</p>

    <h1>ORDERS</h1>

</section>


<div class="orders-container" id="ordersContainer">
</div>


<script>

function loadOrders(){

    const container =
        document.getElementById("ordersContainer");


    /*
       Get latest order details
       saved during checkout/payment
    */

    const cart =
        JSON.parse(
            localStorage.getItem("solevaultCart")
        );


    const customer =
        JSON.parse(
            localStorage.getItem("solevaultCustomer")
        );


    const orderId =
        localStorage.getItem("solevaultOrderId");


    const amount =
        Number(
            localStorage.getItem(
                "solevaultOrderAmount"
            )
        ) || 0;


    const paymentMethod =
        localStorage.getItem(
            "solevaultPaymentMethod"
        ) || "UPI";


    const orderStatus =
        localStorage.getItem(
            "solevaultOrderStatus"
        ) || "Order Placed";


    const paymentStatus =
        localStorage.getItem(
            "solevaultPaymentStatus"
        ) || "Paid";


    /* NO ORDER */

    if(!orderId || !cart){

        container.innerHTML = `

            <div class="empty">

                <h2>NO ORDERS YET</h2>

                <p>
                    You haven't placed any orders yet.
                </p>

                <a
                    href="shop.html"
                    class="shop-btn">

                    START SHOPPING →

                </a>

            </div>

        `;

        return;

    }


    /* ORDER DATE */

    let orderDate =
        localStorage.getItem(
            "solevaultOrderDate"
        );


    if(!orderDate){

        orderDate =
            new Date().toLocaleDateString(
                "en-IN"
            );

        localStorage.setItem(
            "solevaultOrderDate",
            orderDate
        );

    }


    /* CREATE ORDER CARD */

    container.innerHTML = `

        <div class="order-card">

            <div class="order-top">

                <div>

                    <div class="order-id">
                        ORDER ID:
                        <strong>#${orderId}</strong>
                    </div>

                    <div
                        class="order-id"
                        style="margin-top:6px;">

                        ORDER DATE:
                        ${orderDate}

                    </div>

                </div>

                <div class="order-status">
                    ✓ ${orderStatus}
                </div>

            </div>


            <div class="order-content">

                <img
                    class="order-image"
                    src="${cart.image}"
                    alt="${cart.name}">


                <div>

                    <h2 class="product-name">
                        ${cart.name}
                    </h2>

                    <div class="product-info">

                        Brand:
                        ${cart.brand}
                        <br>

                        Size:
                        ${cart.size || "9"}
                        <br>

                        Quantity:
                        ${cart.quantity || 1}

                    </div>

                </div>


                <div class="order-price">

                    <small>TOTAL AMOUNT</small>

                    <strong>
                        ₹${amount.toLocaleString("en-IN")}
                    </strong>

                </div>

            </div>


            <div class="details">

                <div class="detail-box">

                    <small>PAYMENT</small>

                    <span>
                        ${paymentStatus} ✓
                    </span>

                </div>


                <div class="detail-box">

                    <small>PAYMENT METHOD</small>

                    <span>
                        ${paymentMethod}
                    </span>

                </div>


                <div class="detail-box">

                    <small>ORDER STATUS</small>

                    <span>
                        ${orderStatus}
                    </span>

                </div>

            </div>

        </div>

    `;

}


loadOrders();

</script>

</body>
</html>
