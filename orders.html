<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Orders | SOLEVault</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
}

/* NAVBAR */

nav{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    border-bottom:1px solid #222;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    font-weight:400;
}

.back{
    color:#aaa;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:white;
}


/* HEADER */

.header{
    text-align:center;
    padding:55px 7% 35px;
}

.header p{
    color:#777;
    font-size:12px;
    letter-spacing:4px;
    margin-bottom:15px;
}

.header h1{
    font-size:48px;
}


/* CONTAINER */

.container{
    width:86%;
    max-width:900px;
    margin:auto;
    padding-bottom:70px;
}


/* ORDER CARD */

.order-card{
    background:#111;
    border:1px solid #222;
    padding:25px;
    margin-bottom:20px;
}


/* TOP */

.order-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding-bottom:18px;
    border-bottom:1px solid #222;
}

.order-id{
    font-weight:bold;
    margin-bottom:6px;
}

.order-date{
    color:#666;
    font-size:11px;
}

.status{
    color:#b8e600;
    font-size:13px;
    font-weight:bold;
}


/* PRODUCT */

.product{
    display:flex;
    gap:20px;
    padding:20px 0;
}

.product img{
    width:100px;
    height:100px;
    object-fit:cover;
    background:#050505;
}

.product-info h2{
    font-size:18px;
    margin-bottom:8px;
}

.product-info p{
    color:#888;
    font-size:13px;
    margin:6px 0;
}


/* BOTTOM */

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #222;
    padding-top:18px;
    color:#aaa;
    font-size:13px;
}

.payment-paid{
    color:#b8e600;
    font-weight:bold;
}

.amount{
    color:white;
    font-size:20px;
    font-weight:bold;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    background:#111;
    border:1px solid #222;
}

.empty h2{
    margin-bottom:12px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    padding:14px 25px;
    background:white;
    color:#050505;
    text-decoration:none;
    font-weight:bold;
}

.shop-btn:hover{
    background:#ccc;
}


/* ERROR */

.error{
    color:#ff6b6b;
}


/* MOBILE */

@media(max-width:600px){

    .header h1{
        font-size:38px;
    }

    .container{
        width:92%;
    }

    .order-top{
        flex-direction:column;
    }

    .product img{
        width:80px;
        height:80px;
    }

    .bottom{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        SOLE<span>Vault</span>
    </div>

    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>

</nav>


<!-- HEADER -->

<section class="header">

    <p>YOUR PURCHASE HISTORY</p>

    <h1>MY ORDERS</h1>

</section>


<!-- ORDERS -->

<div
    class="container"
    id="ordersContainer"
>

    <div class="empty">

        <h2>
            Loading Orders...
        </h2>

        <p>
            Please wait.
        </p>

    </div>

</div>


<script>


// ==========================================
// LOAD ALL ORDERS
// ==========================================

async function loadOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    try{

        const response =
            await fetch(
                "/api/orders"
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        // No orders

        if(
            !data.success ||
            !data.orders ||
            data.orders.length === 0
        ){

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        You haven't placed any
                        orders yet.
                    </p>

                    <a
                        href="shop.html"
                        class="shop-btn"
                    >
                        START SHOPPING →
                    </a>

                </div>

            `;

            return;

        }


        // Clear loading

        container.innerHTML = "";


        // Show orders

        data.orders
            .slice()
            .reverse()
            .forEach(order => {


                const product =
                    order.product || {};


                const image =
                    product.image || "";


                const name =
                    product.name ||
                    "Sneaker";


                const brand =
                    product.brand ||
                    "-";


                const quantity =
                    order.quantity ||
                    1;


                const size =
                    order.size ||
                    "-";


                const amount =
                    Number(
                        order.amount || 0
                    )
                    .toLocaleString(
                        "en-IN"
                    );


                const paymentStatus =
                    order.paymentStatus ||
                    "Pending";


                const orderStatus =
                    order.orderStatus ||
                    "Order Created";


                const date =
                    order.createdAt
                    ?
                    new Date(
                        order.createdAt
                    )
                    .toLocaleString(
                        "en-IN"
                    )
                    :
                    "-";


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-top">

                        <div>

                            <div class="order-id">

                                ORDER #${order.orderId}

                            </div>

                            <div class="order-date">

                                ${date}

                            </div>

                        </div>


                        <div class="status">

                            ${orderStatus}

                        </div>

                    </div>


                    <div class="product">

                        ${
                            image
                            ?
                            `
                            <img
                                src="${image}"
                                alt="${name}"
                            >
                            `
                            :
                            `
                            <div
                                style="
                                width:100px;
                                height:100px;
                                background:#050505;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                color:#666;
                                "
                            >
                                NO IMAGE
                            </div>
                            `
                        }


                        <div class="product-info">

                            <h2>
                                ${name}
                            </h2>

                            <p>
                                Brand:
                                ${brand}
                            </p>

                            <p>
                                Size:
                                ${size}
                            </p>

                            <p>
                                Quantity:
                                ${quantity}
                            </p>

                        </div>

                    </div>


                    <div class="bottom">

                        <div>

                            Payment:

                            <span
                                class="
                                ${
                                    paymentStatus === "Paid"
                                    ?
                                    "payment-paid"
                                    :
                                    ""
                                }
                                "
                            >

                                ${paymentStatus}

                            </span>

                            <br>

                            <span
                                style="
                                color:#777;
                                margin-top:5px;
                                display:inline-block;
                                "
                            >

                                ${orderStatus}

                            </span>

                        </div>


                        <div class="amount">

                            ₹${amount}

                        </div>

                    </div>

                `;


                container.appendChild(
                    card
                );

            });


    }catch(error){

        console.error(
            error
        );


        container.innerHTML = `

            <div class="empty">

                <h2 class="error">
                    Unable to Load Orders
                </h2>

                <p>
                    Please make sure your
                    SOLEVault server is running.
                </p>

                <a
                    href="index.html"
                    class="shop-btn"
                >
                    BACK TO HOME
                </a>

            </div>

        `;

    }

}


// START

loadOrders();

</script>


</body>

</html>
