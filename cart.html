<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | SOLEVault</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
}

/* NAVBAR */
nav{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    border-bottom:1px solid #222;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    font-weight:400;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:13px;
    text-transform:uppercase;
}

nav a:hover{
    color:#888;
}

.icons{
    font-size:18px;
}

/* HEADER */
.cart-header{
    text-align:center;
    padding:65px 7% 40px;
    animation:fadeDown .8s ease;
}

.cart-header p{
    color:#777;
    letter-spacing:4px;
    font-size:12px;
    margin-bottom:15px;
}

.cart-header h1{
    font-size:55px;
    letter-spacing:-3px;
}

/* CART AREA */
.cart-container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:50px;
    padding:30px 7% 80px;
}

/* ITEMS */
.cart-items{
    border-top:1px solid #222;
}

.cart-item{
    display:grid;
    grid-template-columns:130px 1fr auto;
    gap:25px;
    align-items:center;
    padding:25px 0;
    border-bottom:1px solid #222;
    animation:fadeUp .7s ease;
}

.cart-item img{
    width:130px;
    height:130px;
    object-fit:cover;
    background:#eee;
}

.item-info h2{
    font-size:18px;
    margin-bottom:8px;
}

.item-info p{
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

.item-price{
    font-weight:bold;
}

/* QUANTITY */
.quantity{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:15px;
}

.quantity button{
    width:30px;
    height:30px;
    background:#111;
    color:white;
    border:1px solid #333;
    cursor:pointer;
}

.quantity span{
    min-width:20px;
    text-align:center;
}

/* REMOVE */
.remove{
    color:#777;
    background:none;
    border:none;
    cursor:pointer;
    margin-top:15px;
}

.remove:hover{
    color:white;
}

/* SUMMARY */
.summary{
    background:#111;
    padding:30px;
    height:max-content;
    animation:slideRight .8s ease;
}

.summary h2{
    margin-bottom:30px;
    font-size:24px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #222;
    color:#aaa;
}

.summary-row.total{
    color:white;
    font-size:20px;
    font-weight:bold;
    border-bottom:none;
}

.checkout{
    width:100%;
    padding:17px;
    background:white;
    color:black;
    border:none;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
    transition:.3s;
}

.checkout:hover{
    background:#ccc;
    transform:translateY(-3px);
}

.continue{
    display:block;
    text-align:center;
    color:#777;
    text-decoration:none;
    margin-top:20px;
    font-size:13px;
}

.continue:hover{
    color:white;
}

/* ANIMATIONS */
@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes slideRight{
    from{
        opacity:0;
        transform:translateX(40px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* MOBILE */
@media(max-width:800px){

    nav ul{
        display:none;
    }

    .cart-container{
        grid-template-columns:1fr;
    }

    .cart-item{
        grid-template-columns:90px 1fr;
    }

    .cart-item img{
        width:90px;
        height:90px;
    }

    .item-price{
        grid-column:2;
    }

    .cart-header h1{
        font-size:42px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>

    <div class="logo">
        SOLE<span>Vault</span>
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="product.html">Product</a></li>
        <li><a href="#">New Drops</a></li>
    </ul>

    <div class="icons">🛒</div>

</nav>


<!-- HEADER -->
<section class="cart-header">

    <p>YOUR SELECTION</p>

    <h1>SHOPPING CART</h1>

</section>


<!-- CART -->
<section class="cart-container">

    <!-- ITEMS -->
    <div class="cart-items">

        <div class="cart-item">

            <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
            alt="Sneaker">

            <div class="item-info">

                <h2>Air Max Street</h2>

                <p>Brand: Nike</p>

                <p>Size: 9</p>

                <div class="quantity">

                    <button onclick="decrease()">−</button>

                    <span id="qty">1</span>

                    <button onclick="increase()">+</button>

                </div>

                <button class="remove" onclick="removeItem()">
                    Remove
                </button>

            </div>

            <div class="item-price">
                ₹12,999
            </div>

        </div>

    </div>


    <!-- SUMMARY -->
    <div class="summary">

        <h2>ORDER SUMMARY</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">₹12,999</span>
        </div>

        <div class="summary-row">
            <span>Delivery</span>
            <span>FREE</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span id="total">₹12,999</span>
        </div>

        <button class="checkout" onclick="goCheckout()">
            PROCEED TO CHECKOUT →
        </button>

        <a href="shop.html" class="continue">
            ← Continue Shopping
        </a>

    </div>

</section>


<script>

const savedCart =
    JSON.parse(localStorage.getItem("solevaultCart"));

const cartItem =
    document.querySelector(".cart-item");

if(savedCart){

    cartItem.querySelector("img").src =
        savedCart.image;

    cartItem.querySelector("h2").innerText =
        savedCart.name;

    cartItem.querySelector(".item-info p").innerText =
        "Brand: " + savedCart.brand;

    cartItem.querySelector(".item-price").innerText =
        "₹" + savedCart.price.toLocaleString("en-IN");

}else{

    cartItem.style.display = "none";

}


let quantity =
    savedCart ? savedCart.quantity : 0;

const price =
    savedCart ? savedCart.price : 0;


function updateTotal(){

    const total = price * quantity;

    document.getElementById("qty").innerText =
        quantity;

    document.getElementById("subtotal").innerText =
        "₹" + total.toLocaleString("en-IN");

    document.getElementById("total").innerText =
        "₹" + total.toLocaleString("en-IN");

}


function increase(){

    quantity++;

    savedCart.quantity = quantity;

    localStorage.setItem(
        "solevaultCart",
        JSON.stringify(savedCart)
    );

    updateTotal();

}


function decrease(){

    if(quantity > 1){

        quantity--;

        savedCart.quantity = quantity;

        localStorage.setItem(
            "solevaultCart",
            JSON.stringify(savedCart)
        );

        updateTotal();

    }

}


function removeItem(){

    localStorage.removeItem("solevaultCart");

    cartItem.style.display = "none";

    document.getElementById("subtotal").innerText =
        "₹0";

    document.getElementById("total").innerText =
        "₹0";

}


function goCheckout(){

    if(!savedCart || quantity === 0){

        alert("Your cart is empty.");

        return;

    }

    window.location.href =
        "checkout.html";

}


updateTotal();

</script>
</body>
</html>
