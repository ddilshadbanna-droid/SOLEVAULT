<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | SOLEVault</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f0;
    color:#111;
}

/* NAVBAR */

nav{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:#fff;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    font-weight:400;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav a{
    color:#111;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
}

nav a:hover{
    color:#8ee600;
}

.icons{
    font-size:19px;
}

/* HEADER */

.cart-header{
    text-align:center;
    padding:70px 7% 45px;
}

.cart-header p{
    color:#777;
    letter-spacing:4px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:15px;
}

.cart-header h1{
    font-size:58px;
    letter-spacing:-3px;
    font-weight:900;
}

/* CART AREA */

.cart-container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:35px;
    padding:20px 6% 80px;
}

/* ITEMS */

.cart-items{
    background:#fff;
    border:1px solid #ddd;
    border-radius:16px;
    padding:0 25px;
}

.cart-item{
    display:grid;
    grid-template-columns:150px 1fr auto;
    gap:25px;
    align-items:center;
    padding:25px 0;
}

.cart-item img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:12px;
    background:#eee;
}

.item-info h2{
    font-size:20px;
    margin-bottom:9px;
}

.item-info p{
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

.item-price{
    font-weight:900;
    font-size:17px;
}

/* QUANTITY */

.quantity{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:17px;
}

.quantity button{
    width:32px;
    height:32px;
    background:#111;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:18px;
}

.quantity button:hover{
    background:#9cff00;
    color:#111;
}

.quantity span{
    min-width:20px;
    text-align:center;
    font-weight:bold;
}

/* REMOVE */

.remove{
    color:#888;
    background:none;
    border:none;
    cursor:pointer;
    margin-top:14px;
    font-size:12px;
}

.remove:hover{
    color:#111;
}

/* SUMMARY */

.summary{
    background:#111;
    color:white;
    border-radius:16px;
    padding:30px;
    height:max-content;
}

.summary h2{
    font-size:23px;
    margin-bottom:25px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid #292929;
    color:#aaa;
}

.summary-row.total{
    color:white;
    font-size:20px;
    font-weight:bold;
    border-bottom:none;
}

/* CHECKOUT */

.checkout{
    width:100%;
    padding:16px;
    margin-top:18px;
    background:#9cff00;
    color:#111;
    border:none;
    border-radius:8px;
    font-weight:900;
    cursor:pointer;
    transition:.25s;
}

.checkout:hover{
    background:#b4ff45;
    transform:translateY(-2px);
}

/* CONTINUE */

.continue{
    display:block;
    text-align:center;
    color:#777;
    text-decoration:none;
    margin-top:20px;
    font-size:13px;
}

.continue:hover{
    color:white;
}

/* FOOTER */

footer{
    background:#111;
    color:#777;
    text-align:center;
    padding:40px 7%;
    font-size:12px;
}

/* MOBILE */

@media(max-width:850px){

    nav ul{
        display:none;
    }

    .cart-container{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .cart-header h1{
        font-size:40px;
    }

    .cart-container{
        padding:20px 5% 60px;
    }

    .cart-item{
        grid-template-columns:90px 1fr;
        gap:15px;
    }

    .cart-item img{
        width:90px;
        height:90px;
    }

    .item-price{
        grid-column:2;
    }

    .cart-items{
        padding:0 15px;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        SOLE<span>Vault</span>
    </div>

    <ul>

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="shop.html">
                Shop
            </a>
        </li>

        <li>
            <a href="shop.html">
                Brands
            </a>
        </li>

        <li>
            <a href="shop.html">
                New Drops
            </a>
        </li>

        <li>
            <a href="shop.html">
                Sale
            </a>
        </li>

    </ul>

    <div class="icons">
        🛒
    </div>

</nav>


<!-- HEADER -->

<section class="cart-header">

    <p>YOUR SELECTION</p>

    <h1>SHOPPING CART</h1>

</section>


<!-- CART -->

<section class="cart-container">


    <!-- ITEMS -->

    <div class="cart-items">

        <div class="cart-item">

            <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
            alt="Sneaker">


            <div class="item-info">

                <h2>
                    Air Max Street
                </h2>

                <p>
                    Brand: Nike
                </p>

                <p>
                    Size: 9
                </p>


                <div class="quantity">

                    <button onclick="decrease()">
                        −
                    </button>

                    <span id="qty">
                        1
                    </span>

                    <button onclick="increase()">
                        +
                    </button>

                </div>


                <button
                    class="remove"
                    onclick="removeItem()">

                    Remove

                </button>

            </div>


            <div class="item-price">

                ₹12,999

            </div>

        </div>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <h2>
            ORDER SUMMARY
        </h2>


        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <span id="subtotal">
                ₹12,999
            </span>

        </div>


        <div class="summary-row">

            <span>
                Delivery
            </span>

            <span>
                FREE
            </span>

        </div>


        <div class="summary-row total">

            <span>
                Total
            </span>

            <span id="total">
                ₹12,999
            </span>

        </div>


        <button
            class="checkout"
            onclick="goCheckout()">

            PROCEED TO CHECKOUT →

        </button>


        <a
            href="shop.html"
            class="continue">

            ← Continue Shopping

        </a>

    </div>

</section>


<!-- FOOTER -->

<footer>

    © 2026 SOLEVault — Premium Sneakers

</footer>


<script>

/* LOAD CART */

const savedCart =
    JSON.parse(
        localStorage.getItem("solevaultCart")
    );


const cartItem =
    document.querySelector(".cart-item");


if(savedCart){

    cartItem.querySelector("img").src =
        savedCart.image;

    cartItem.querySelector("h2").innerText =
        savedCart.name;

    cartItem.querySelector(".item-info p").innerText =
        "Brand: " + savedCart.brand;

    cartItem.querySelector(".item-price").innerText =
        "₹" +
        savedCart.price.toLocaleString("en-IN");

}else{

    cartItem.style.display = "none";

}


let quantity =
    savedCart ? savedCart.quantity : 0;


const price =
    savedCart ? savedCart.price : 0;


/* UPDATE TOTAL */

function updateTotal(){

    const total =
        price * quantity;


    document.getElementById("qty").innerText =
        quantity;


    document.getElementById("subtotal").innerText =
        "₹" +
        total.toLocaleString("en-IN");


    document.getElementById("total").innerText =
        "₹" +
        total.toLocaleString("en-IN");

}


/* INCREASE */

function increase(){

    quantity++;

    savedCart.quantity =
        quantity;

    localStorage.setItem(
        "solevaultCart",
        JSON.stringify(savedCart)
    );

    updateTotal();

}


/* DECREASE */

function decrease(){

    if(quantity > 1){

        quantity--;

        savedCart.quantity =
            quantity;

        localStorage.setItem(
            "solevaultCart",
            JSON.stringify(savedCart)
        );

        updateTotal();

    }

}


/* REMOVE */

function removeItem(){

    localStorage.removeItem(
        "solevaultCart"
    );

    cartItem.style.display =
        "none";

    document.getElementById("subtotal").innerText =
        "₹0";

    document.getElementById("total").innerText =
        "₹0";

    quantity = 0;

}


/* CHECKOUT */

function goCheckout(){

    if(
        !savedCart ||
        quantity === 0
    ){

        alert(
            "Your cart is empty."
        );

        return;

    }


    window.location.href =
        "checkout.html";

}


updateTotal();

</script>


</body>

</html>
