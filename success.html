<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Confirmed | SOLEVault</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

/* SUCCESS BOX */

.success-box{
    background:#111;
    width:90%;
    max-width:500px;
    padding:40px 25px;
    text-align:center;
    border:1px solid #222;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    animation:fadeIn .7s ease;
}

/* CHECK */

.check{
    width:80px;
    height:80px;
    margin:0 auto 20px;

    border-radius:50%;

    background:white;
    color:#050505;

    font-size:45px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* TITLE */

h1{
    font-size:28px;
    margin-bottom:10px;
}

.message{
    color:#888;
    margin-bottom:25px;
    line-height:1.6;
}

/* ORDER DETAILS */

.order-details{
    background:#050505;
    padding:20px;
    border:1px solid #222;
    text-align:left;
    margin-bottom:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;

    margin:13px 0;

    color:#aaa;
}

.row span:last-child{
    color:white;
    font-weight:bold;
    text-align:right;
}

.status{
    color:#55c878 !important;
}

/* BUTTONS */

.btn{
    display:block;
    width:100%;

    padding:14px;

    background:white;
    color:#050505;

    text-decoration:none;
    font-weight:bold;

    margin-top:10px;

    transition:.3s;
}

.btn:hover{
    background:#ccc;
    transform:translateY(-2px);
}

/* TRACK */

.track{
    background:#050505;
    color:white;
    border:1px solid #444;
}

.track:hover{
    background:#222;
}

/* HOME */

.home{
    background:#111;
    color:white;
    border:1px solid #444;
}

.home:hover{
    background:#222;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* MOBILE */

@media(max-width:500px){

    .success-box{
        padding:35px 18px;
    }

    h1{
        font-size:24px;
    }

    .row{
        font-size:13px;
    }

}

</style>

</head>


<body>


<div class="success-box">


    <!-- SUCCESS ICON -->

    <div class="check">
        ✓
    </div>


    <!-- TITLE -->

    <h1>
        Order Confirmed!
    </h1>


    <p class="message">

        Thank you for shopping with SOLEVault.
        Your order has been successfully placed.

    </p>


    <!-- ORDER DETAILS -->

    <div class="order-details">


        <!-- ORDER ID -->

        <div class="row">

            <span>
                Order ID
            </span>

            <span id="orderId">
                Loading...
            </span>

        </div>


        <!-- PAYMENT -->

        <div class="row">

            <span>
                Payment
            </span>

            <span class="status">
                Paid ✓
            </span>

        </div>


        <!-- PAYMENT METHOD -->

        <div class="row">

            <span>
                Payment Method
            </span>

            <span id="paymentMethod">
                Loading...
            </span>

        </div>


        <!-- TOTAL -->

        <div class="row">

            <span>
                Total Amount
            </span>

            <span id="totalAmount">
                Loading...
            </span>

        </div>


        <!-- STATUS -->

        <div class="row">

            <span>
                Order Status
            </span>

            <span class="status">
                Confirmed ✓
            </span>

        </div>


    </div>


    <!-- TRACK ORDER -->

    <a
        href="tracking.html"
        class="btn track">

        TRACK ORDER →

    </a>


    <!-- CONTINUE SHOPPING -->

    <a
        href="shop.html"
        class="btn">

        CONTINUE SHOPPING

    </a>


    <!-- HOME -->

    <a
        href="index.html"
        class="btn home">

        BACK TO HOME

    </a>


</div>


<script>


/* =========================
   GET ORDER DATA
========================= */


const orderId =
    localStorage.getItem(
        "solevaultOrderId"
    );


const amount =
    localStorage.getItem(
        "solevaultOrderAmount"
    );


const paymentStatus =
    localStorage.getItem(
        "solevaultPaymentStatus"
    );


const paymentMethod =
    localStorage.getItem(
        "solevaultPaymentMethod"
    );


/* =========================
   ORDER ID
========================= */


if(orderId){

    document.getElementById(
        "orderId"
    ).textContent =
        "#" + orderId;

}else{

    document.getElementById(
        "orderId"
    ).textContent =
        "Not available";

}


/* =========================
   TOTAL AMOUNT
========================= */


if(amount){

    document.getElementById(
        "totalAmount"
    ).textContent =
        "₹" +
        Number(amount)
        .toLocaleString("en-IN");

}else{

    document.getElementById(
        "totalAmount"
    ).textContent =
        "Amount unavailable";

}


/* =========================
   PAYMENT METHOD
========================= */


if(paymentMethod){

    document.getElementById(
        "paymentMethod"
    ).textContent =
        paymentMethod;

}else{

    document.getElementById(
        "paymentMethod"
    ).textContent =
        "Not available";

}


/* =========================
   PAYMENT STATUS
========================= */


if(paymentStatus === "Paid"){

    console.log(
        "Payment confirmed"
    );

}


</script>


</body>

</html>
